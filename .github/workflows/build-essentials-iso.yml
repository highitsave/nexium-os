{"name":"Build Nexium Essentials ISO","on":{"workflow_dispatch":{}},"permissions":{"contents":"read"},"jobs":{"build":{"runs-on":"ubuntu-latest","timeout-minutes":60,"steps":[{"uses":"actions/checkout@v4"},{"name":"Build isolated essentials with native Debian bookworm tools","run":"mkdir essentials\nset -o pipefail\ndocker run --rm -i --privileged -v \"$GITHUB_WORKSPACE/essentials:/work\" -w /work debian:bookworm bash -euo pipefail <<'BUILD' 2>&1 | tee build-essentials.log\nexport DEBIAN_FRONTEND=noninteractive\napt-get -o Acquire::Retries=5 update\napt-get -o Acquire::Retries=5 install -y --no-install-recommends live-build debootstrap debian-archive-keyring ca-certificates gnupg xorriso squashfs-tools isolinux syslinux-common syslinux-utils grub-pc-bin grub-efi-amd64-bin dosfstools mtools\nlb config --mode debian --distribution bookworm --architectures amd64 --binary-images iso-hybrid --bootloaders syslinux,grub-efi --archive-areas main --apt-recommends false --firmware-chroot false --firmware-binary false --linux-flavours amd64 --linux-packages linux-image --initramfs live-boot --debootstrap-options '--variant=minbase' --mirror-bootstrap http://deb.debian.org/debian --mirror-chroot http://deb.debian.org/debian --mirror-chroot-security http://security.debian.org/debian-security --mirror-binary http://deb.debian.org/debian --mirror-binary-security http://security.debian.org/debian-security --bootappend-live 'boot=live components username=nexium hostname=nexium'\nprintf 'LB_BOOTSTRAP_INCLUDE=\"gnupg,ca-certificates\"\\n' >> config/bootstrap\nprintf '%s\\n' linux-image-amd64 live-boot live-config live-config-systemd systemd-sysv sudo network-manager wpasupplicant iproute2 iputils-ping ca-certificates gnupg apt > config/package-lists/nexium-essentials.list.chroot\nmkdir -p config/includes.chroot/etc/apt/apt.conf.d config/includes.chroot/etc/systemd/system/multi-user.target.wants\nprintf 'Acquire::Retries \"5\";\\n' > config/includes.chroot/etc/apt/apt.conf.d/80nexium-retries\nln -s /lib/systemd/system/NetworkManager.service config/includes.chroot/etc/systemd/system/multi-user.target.wants/NetworkManager.service\ntest ! -e config/package-lists/nexium-apps.list.chroot\necho 'NEXIUM: configuration passed; optional firmware Contents lookups disabled'\nlb build\necho 'NEXIUM: live-build passed'\nisos=(*.iso); test \"${#isos[@]}\" -eq 1\nxorriso -indev \"${isos[0]}\" -report_el_torito plain\nchroot chroot dpkg-query -W linux-image-amd64 live-boot live-config systemd-sysv network-manager apt\nchroot chroot apt-get --version\nchroot chroot nmcli --version\ntest -n \"$(find chroot/boot -name 'vmlinuz-*' -print -quit)\"\ntest -n \"$(find chroot/boot -name 'initrd.img-*' -print -quit)\"\nsha256sum \"${isos[0]}\" > SHA256SUMS\nstat -c 'ISO: %n; bytes: %s' \"${isos[0]}\" | tee iso-size.txt\nif [ \"$(stat -c '%s' \"${isos[0]}\")\" -lt 1000000000 ]; then echo 'ISO under 1 GB: PASS' | tee -a iso-size.txt; else echo 'ISO exceeds 1 GB target' | tee -a iso-size.txt; fi\necho 'NEXIUM: package and boot-catalog checks passed (hardware boot not tested)'\nBUILD\ncat essentials/iso-size.txt >> \"$GITHUB_STEP_SUMMARY\""},{"name":"Upload essentials ISO","uses":"actions/upload-artifact@v4","with":{"name":"nexium-essentials-bookworm-iso","path":"essentials/*.iso\nessentials/SHA256SUMS\nessentials/iso-size.txt","compression-level":0,"if-no-files-found":"error"}},{"name":"Preserve build diagnostics","if":"always()","uses":"actions/upload-artifact@v4","with":{"name":"nexium-essentials-build-log","path":"build-essentials.log","if-no-files-found":"ignore"}}]}}}
