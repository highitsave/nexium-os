name: Recheck painted Nexium window against unchanged replacement ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/nexium-browser-capture-recheck.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: nexium-browser-capture
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install host X helpers and repair guest GUI probe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xdotool wmctrl scrot x11-utils python3-pil ffmpeg tesseract-ocr
          mkdir -p reports/boot/frames output
          cat > scripts/repair-nexium-capture.py <<'PY'
          """Test-only guest provisioning and strict paint gate; does not modify ISO or browser."""
          import ast
          from pathlib import Path
          p=Path('scripts/capture-nexium-browser.py')
          s=p.read_text()
          if '# NEXIUM_STRICT_PAINT_PROBE' in s:
              print('Strict capture repair already present')
              raise SystemExit(0)
          needle="text = open('/usr/share/applications/nexium-browser.desktop').read()"
          provision=r'''# NEXIUM_STRICT_PAINT_PROBE
          # X helpers must exist INSIDE the guest running this probe, not only on the host.
          data['test_only_guest_packages'] = []
          try:
              for setup in [['sudo','-n','apt-get','update'], ['sudo','-n','env','DEBIAN_FRONTEND=noninteractive','apt-get','install','-y','--no-install-recommends','xdotool','wmctrl','scrot','x11-utils']]:
                  result=subprocess.run(setup,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
                  record={'argv':setup,'exit':result.returncode,'output':result.stdout}
                  data['test_only_guest_packages'].append(record)
                  print(json.dumps(record),flush=True)
                  assert result.returncode==0, 'FAIL guest X helper installation'
              data['test_helpers']=command('command -v xdotool; command -v wmctrl; command -v scrot; command -v xwininfo; command -v xprop')
              assert data['test_helpers']['exit']==0
          except Exception as e:
              data['setup_error']=repr(e);data['browser_gui_pass']=False;data['pass']=False
              urllib.request.urlopen(urllib.request.Request('http://10.0.2.2:8888/report',data=json.dumps(data,indent=2).encode(),method='POST')).read()
              raise
          '''
          assert s.count(needle)==1
          s=s.replace(needle,provision+'\n'+needle)
          begin=s.index('# Accept the actual Terms widget through X11 input; no shipped bypass.')
          end=s.index('began = time.monotonic()',begin)
          terms=r'''# Accept only the real mapped Terms window's bottom-right I Agree button.
          # No test bypass is introduced into the shipped browser source.
          terms_started=time.monotonic()
          data['terms_interaction']=[]
          while time.monotonic()-terms_started<90 and browser.poll() is None:
              terms=command("xdotool search --onlyvisible --name '^Nexium Browser.*Terms of Service$'")
              data['terms_window']=terms
              if terms['exit']==0 and terms['output'].strip():
                  wid=terms['output'].splitlines()[0]
                  geometry=command('xdotool getwindowgeometry --shell '+wid)
                  values=dict(re.findall(r'^(WIDTH|HEIGHT)=(\d+)$',geometry['output'],re.M))
                  if int(values.get('WIDTH',0))>=720 and int(values.get('HEIGHT',0))>=570:
                      data['terms_geometry']=geometry
                      data['terms_interaction'].append(command('wmctrl -ia '+wid))
                      time.sleep(2)
                      # Contents margins: right 34px, bottom 30px; button centre is ~84,49px inward.
                      x=int(values['WIDTH'])-84;y=int(values['HEIGHT'])-49
                      data['terms_interaction'].append(command('xdotool mousemove --window '+wid+' '+str(x)+' '+str(y)+' click 1'))
                      time.sleep(15)
                      data['terms_after_accept']=command("xdotool search --onlyvisible --name '^Nexium Browser.*Terms of Service$'")
                      break
              time.sleep(2)
          '''
          s=s[:begin]+terms+s[end:]
          s=s.replace("int(m[3]) < 100 or int(m[4]) < 100", "int(m[3]) < 900 or int(m[4]) < 600")
          s=s.replace("'pid':window_pid}", "'pid':window_pid, 'width':int(m[3]), 'height':int(m[4])}")
          needle="browser_log.flush()"
          paint=r'''data['browser_paint_capture']=None
          if data['browser_processes'] and data['browser_windows'] and browser.poll() is None:
              wid=data['browser_windows'][0]['id']
              data['browser_activate']=command('wmctrl -ia '+wid)
              time.sleep(8)
              data['browser_paint_capture']=command('scrot --overwrite -u /tmp/nexium-browser-window.png')
              if data['browser_paint_capture']['exit']==0:
                  urllib.request.urlopen(urllib.request.Request('http://10.0.2.2:8888/browser-window.png',data=open('/tmp/nexium-browser-window.png','rb').read(),method='POST')).read()
          '''
          assert s.count(needle)==1
          s=s.replace(needle,paint+'\n'+needle)
          s=s.replace("data['browser_gui_pass'] = bool(data['browser_processes'] and data['browser_windows'])", "data['browser_gui_pass'] = bool(data['browser_processes'] and data['browser_windows'] and data.get('browser_paint_capture',{}).get('exit')==0)")
          s=s.replace("data['pass']=data['plank_running']", "data['pass']=data['browser_gui_pass'] and data['plank_running']")
          needle="(O/'live-session.json').write_bytes(self.rfile.read(int(self.headers['Content-Length'])))"
          assert s.count(needle)==1
          s=s.replace(needle,"target = O/('browser-window.png' if self.path=='/browser-window.png' else 'live-session.json')\n        target.write_bytes(self.rfile.read(int(self.headers['Content-Length'])))")
          s=s.replace('for _ in range(180):','for _ in range(360):')
          # Emit browser logs BEFORE any assertion, including failures of the combined pass flag.
          begin=s.index("print('NEXIUM STDOUT/STDERR BEGIN'")
          end=s.index("assert live.get('browser_gui_pass')",begin)
          logging=s[begin:end]
          s=s[:begin]+s[end:]
          gate="assert ready is not None,'FAIL: desktop never reached'"
          assert s.count(gate)==1
          s=s.replace(gate,logging+'\n'+gate)
          s += "\nsubprocess.run(['python3','scripts/assert-nexium-capture.py',str(O)],check=True)\n"
          tree=ast.parse(s)
          for node in tree.body:
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='probe' for t in node.targets):
                  compile(ast.literal_eval(node.value),'real-guest-probe','exec')
          compile(s,str(p),'exec')
          p.write_text(s)
          print('PASS strict guest probe syntax, real geometry threshold, stdout/stderr before assertions')
          PY
          cat > scripts/assert-nexium-capture.py <<'PY'
          import sys,json,subprocess
          from pathlib import Path
          from PIL import Image,ImageStat
          root=Path(sys.argv[1]);live=json.loads((root/'live-session.json').read_text())
          print('NEXIUM STDOUT/STDERR BEGIN',flush=True)
          print(live.get('browser_launch',{}).get('stdout_stderr','<no browser report>'),flush=True)
          print('NEXIUM STDOUT/STDERR END',flush=True)
          assert live.get('browser_gui_pass'), 'FAIL browser_gui_pass is false; no usable real browser window'
          assert live.get('browser_processes'), 'FAIL browser process identity'
          windows=live.get('browser_windows',[])
          assert windows and all(w['width']>=900 and w['height']>=600 for w in windows), 'FAIL real window geometry'
          im=Image.open(root/'browser-window.png').convert('RGB')
          colors=len(im.resize((160,100)).getcolors(16000) or [])
          variance=sum(ImageStat.Stat(im).var)
          ocr=subprocess.run(['tesseract',str(root/'browser-window.png'),'stdout'],capture_output=True,text=True,check=True).stdout
          report={'browser_gui_pass':True,'windows':windows,'screenshot_width':im.width,'screenshot_height':im.height,'sample_colors':colors,'pixel_variance_sum':variance,'ocr':ocr,'paint_pass':im.width>=900 and im.height>=600 and colors>=20 and variance>50 and 'Nexium' in ocr,'plank_running':live.get('plank_running'),'sudo_exit':live.get('sudo_noninteractive',{}).get('exit')}
          (root/'browser-paint.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2),flush=True)
          assert report['paint_pass'],'FAIL real browser pixels/geometry/paint OCR'
          assert live.get('plank_running') and live.get('sudo_noninteractive',{}).get('exit')==0
          print('PASS REAL NEXIUM PAINT: mapped normal-size PID-owned X11 window, nonblank pixels and Nexium OCR',flush=True)
          PY
          python3 scripts/repair-nexium-capture.py
          python3 -m py_compile scripts/capture-nexium-browser.py scripts/repair-nexium-capture.py scripts/assert-nexium-capture.py
          # Exercise the same final gate with a known false GUI report through tee.
          mkdir -p reports/negative-test
          printf '%s\n' '{"browser_gui_pass":false,"browser_launch":{"stdout_stderr":"synthetic-failure-log"}}' > reports/negative-test/live-session.json
          set +e
          python3 scripts/assert-nexium-capture.py reports/negative-test 2>&1 | tee reports/negative-test/failure.txt
          rc=$?
          set -e
          echo "FALSE_GUI_PIPELINE_EXIT=$rc" | tee reports/negative-test/result.txt
          test "$rc" -ne 0
          grep -q 'synthetic-failure-log' reports/negative-test/failure.txt
          git config user.name Onx
          git config user.email assistant@email.tomo.ai
          git add scripts/repair-nexium-capture.py scripts/assert-nexium-capture.py scripts/capture-nexium-browser.py
          if ! git diff --cached --quiet; then
            git commit -m 'Provision guest X helpers and require real painted Nexium window'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/download-artifact@v4
        with:
          name: nexium-browser-iso
          run-id: 38469761803
          github-token: ${{ github.token }}
          path: output
      - name: Verify unchanged built ISO identity and size ceiling
        run: |
          set -euo pipefail
          echo '33b84c29c6e16f277b41d91ca7846b14799ae97edeb2127234e8e511a0fc503a  output/nexium-os-1.2-ungoogled-amd64.iso' | sha256sum -c -
          test "$(stat -c %s output/nexium-os-1.2-ungoogled-amd64.iso)" -eq 777256960
          test "$(stat -c %s output/nexium-os-1.2-ungoogled-amd64.iso)" -lt 1000000000
          echo 'UNCHANGED ISO: 777256960 bytes; existing boot-preservation proof remains tied to identical SHA256' | tee reports/iso-identity.txt
          sha256sum output/nexium-os-1.2-ungoogled-amd64.iso | tee -a reports/iso-identity.txt
      - name: Capture actual dock Exec Nexium window and enforce painted GUI failure
        run: |
          set -euo pipefail
          python3 scripts/capture-nexium-browser.py 2>&1 | tee reports/boot-capture.txt
      - name: Preserve all capture evidence even on failure
        if: always()
        run: |
          set -euo pipefail
          dest=tests/nexium-browser-capture/${GITHUB_RUN_ID}
          mkdir -p "$dest"
          cp reports/boot/*.png reports/boot/*.json reports/*.txt "$dest/" 2>/dev/null || true
          cp reports/negative-test/*.txt "$dest/" 2>/dev/null || true
          git config user.name Onx
          git config user.email assistant@email.tomo.ai
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record strict Nexium GUI capture ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          { echo '## Strict Nexium capture of unchanged ISO'; cat reports/iso-identity.txt reports/negative-test/result.txt reports/boot/receipt.json reports/boot/browser-paint.json reports/boot/live-session.json 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexium-browser-strict-capture
          path: reports/
          if-no-files-found: error
