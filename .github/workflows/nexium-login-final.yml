name: Final Nexium login persistence and painted browser proof
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: nexium-phase2
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Validate committed sources and install build and VM tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-yaml python3-pil squashfs-tools xorriso initramfs-tools-core binutils qemu-system-x86 qemu-utils tesseract-ocr ffmpeg e2fsprogs file jq
          python3 - <<'PY' | tee /tmp/all-workflows.txt
          import ast, pathlib, yaml
          for p in sorted(pathlib.Path('.github/workflows').glob('*.y*ml')):
              d=yaml.safe_load(p.read_text())
              assert isinstance(d,dict) and isinstance(d.get('jobs'),dict), str(p)
              print('PASS workflow',p)
          for p in pathlib.Path('scripts').glob('*.py'):
              ast.parse(p.read_text(),filename=str(p))
          print('PASS committed Python sources parse')
          PY
          bash -n scripts/build-login-persistence.sh scripts/build-browser-final.sh
          test -f README.md && test -f LICENSE && test -f CONTRIBUTING.md
          # Use the versioned scripts, never regenerate and overwrite bug fixes
          # from the historical nexium-login-persistence.yml heredoc.
      - uses: actions/download-artifact@v4
        with:
          name: nexium-browser-chooser-iso
          path: output
          github-token: ${{ github.token }}
          repository: highitsave/nexium-os
          run-id: 38483512164
      - name: Build selected Firefox plus login persistence with all boot checks
        run: |
          set -euo pipefail
          find output -maxdepth 2 -type f -printf '%f %s bytes\n'
          mv output/nexium-os-1.2-ungoogled-amd64.iso /tmp/chooser-seed.iso
          rm -f output/*.iso output/*.sha256
          bash scripts/build-login-persistence.sh
      - name: Boot final image and verify painted greeter real reboot persistence and browser
        run: |
          set -euo pipefail
          python3 scripts/capture-login-persistence.py
      - name: Verify exact ISO size and SHA-256 before artifact upload
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee output/verified-iso.json
          import pathlib, hashlib, json
          p=pathlib.Path('output/nexium-os-1.2-ungoogled-amd64.iso')
          size=p.stat().st_size
          assert 0 < size < 1000000000, 'ISO exceeds authorized byte limit'
          h=hashlib.sha256()
          with p.open('rb') as f:
              for b in iter(lambda:f.read(1024*1024), b''): h.update(b)
          print(json.dumps({'name':p.name,'bytes':size,'sha256':h.hexdigest()},indent=2))
          PY
          sha256sum output/*.iso | tee output/final-iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nexium-os-login-persistence-verified-iso
          path: |
            output/*.iso
            output/*.sha256
            output/verified-iso.json
          if-no-files-found: error
      - name: Upload diagnostics even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-final-login-persistence-evidence
          path: |
            reports/
            /tmp/all-workflows.txt
          if-no-files-found: error
      - name: Commit runtime evidence without replacing source fixes
        if: always()
        run: |
          set -euo pipefail
          git config user.name highitsave
          git config user.email 195648961+highitsave@users.noreply.github.com
          dest=tests/login-persistence/${{ github.run_id }}
          mkdir -p "$dest"
          if [ -d reports/boot ]; then
            cp reports/boot/*.{json,log,png} "$dest/" 2>/dev/null || true
          fi
          if [ -d reports/final ]; then cp -r reports/final "$dest/build"; fi
          cp /tmp/all-workflows.txt "$dest/"
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve Nexium login persistence runtime proof'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
