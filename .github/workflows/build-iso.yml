name: Build Nexium ISO (Ubuntu base)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y live-build
      - run: lb config --mode ubuntu --distribution jammy --architectures amd64 --binary-images iso-hybrid --debian-installer none --archive-areas main --security false --linux-flavours amd64 --linux-packages "linux-generic" --initramfs casper
      - run: sudo lb build
      - uses: actions/upload-artifact@v4
        with:
          name: nexium-iso-ubuntu
          path: "*.iso"
