name: Build Nexium ISO
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y live-build
      - run: lb config --mode ubuntu --distribution jammy --architectures amd64 --binary-images iso-hybrid --archive-areas main --linux-flavours generic --linux-packages "linux-image" --initramfs casper
      - run: sudo lb build
      - uses: actions/upload-artifact@v4
        with:
          name: nexium-iso
          path: "*.iso"
