name: Build Nexium ISO
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate bootstrap and all chroot stages; skip ISO assembly
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y live-build gnupg isolinux syslinux-common syslinux-utils xorriso
      - name: Repair the live-build start-stop-daemon diversion
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import tempfile

          # Ubuntu's dual alias diversions collide on Jammy's merged /usr.
          # Use the path recorded by dpkg, not a second filesystem alias.
          version = subprocess.check_output(
              ['dpkg-query', '-W', '-f=${Version}', 'live-build'], text=True)


          script = Path('/usr/lib/live/build/lb_chroot_dpkg')
          original = script.read_text()
          install = '''\t\t# Use one package-owned diversion path for setup and restoration.
          \t\tssd="$(Chroot chroot dpkg-query -L dpkg | grep -xE '/(usr/)?sbin/start-stop-daemon')"
          \t\tcase "$ssd" in
          \t\t\t/sbin/start-stop-daemon|/usr/sbin/start-stop-daemon) ;;
          \t\t\t*) Echo_error "Ambiguous start-stop-daemon package path"; exit 1 ;;
          \t\tesac
          \t\tif [ ! -f "chroot$ssd" ] || [ ! -x "chroot$ssd" ] || [ -L "chroot$ssd" ] ||
          \t\t   [ -n "$(Chroot chroot dpkg-divert --listpackage "$ssd")" ]
          \t\tthen
          \t\t\tEcho_error "Refusing an unexpected start-stop-daemon or diversion"
          \t\t\texit 1
          \t\tfi
          \t\tChroot chroot dpkg-divert --rename --quiet --add "$ssd"
          \t\tln -s /bin/true "chroot$ssd"
          \t\techo "$ssd" > .build/start-stop-daemon.path
          '''
          remove = '''\t\t# Restore only the recorded diversion; never delete its saved executable.
          \t\tif [ -f .build/start-stop-daemon.path ]; then ssd="$(cat .build/start-stop-daemon.path)"
          \t\tcase "$ssd" in
          \t\t\t/sbin/start-stop-daemon|/usr/sbin/start-stop-daemon) ;;
          \t\t\t*) Echo_error "Invalid saved start-stop-daemon path"; exit 1 ;;
          \t\tesac
          \t\tif [ ! -L "chroot$ssd" ] || [ "$(readlink "chroot$ssd")" != /bin/true ] ||
          \t\t   [ ! -f "chroot$ssd.distrib" ] || [ ! -x "chroot$ssd.distrib" ] ||
          \t\t   [ -L "chroot$ssd.distrib" ] ||
          \t\t   [ "$(Chroot chroot dpkg-divert --listpackage "$ssd")" != LOCAL ]
          \t\tthen
          \t\t\tEcho_error "Refusing to remove an unverified start-stop-daemon shim"
          \t\t\texit 1
          \t\tfi
          \t\trm "chroot$ssd" || true
          \t\tChroot chroot dpkg-divert --rename --quiet --remove "$ssd" || true
          \t\trm -f .build/start-stop-daemon.path || true; fi
          '''
          patched = original
          for start, end, replacement, expected in (
              ('\t\t# Create custom start-stop-daemon program\n',
               '\n\t\t# Disable dpkg syncing', install,
               '--add --divert /sbin/start-stop-daemon.distrib.usr-is-merged /sbin/start-stop-daemon'),
              ('\t\t# Remove custom start-stop-daemon program\n',
               '\n\t\t# Remove dpkg sync configuration', remove,
               '--remove /usr/sbin/start-stop-daemon'),
          ):
              if patched.count(start) != 1 or patched.count(end) != 1:
                  raise SystemExit('Unreviewed live-build source layout')
              first, last = patched.index(start), patched.index(end)
              if patched[first:last].count(expected) != 1:
                  raise SystemExit('Unreviewed live-build diversion code')
              patched = patched[:first] + replacement + patched[last:]
          subprocess.run(['sh', '-n'], input=patched, text=True, check=True)

          # Test real dpkg-divert restoration through both merged-/usr aliases.
          wrapper = '''set -e
          Chroot() {
            root="$PWD/$1"; shift
            command="$1"; shift
            case "$command" in
              dpkg-query) echo "$TEST_SSD" ;;
              dpkg-divert) dpkg-divert --root="$root" "$@" ;;
              *) exit 1 ;;
            esac
          }
          Echo_error() { echo "$@" >&2; }
          '''
          for owned in ('/sbin/start-stop-daemon', '/usr/sbin/start-stop-daemon'):
              for changed in (False, True):
                  with tempfile.TemporaryDirectory() as directory:
                      work = Path(directory)
                      root = work / 'chroot'
                      (root / 'usr/sbin').mkdir(parents=True)
                      (root / 'sbin').symlink_to('usr/sbin')
                      (root / 'var/lib/dpkg').mkdir(parents=True)
                      (root / 'var/lib/dpkg/status').touch()
                      (work / '.build').mkdir()
                      binary = root / 'usr/sbin/start-stop-daemon'
                      binary.write_text('original executable\n')
                      binary.chmod(0o755)
                      env = dict(os.environ, TEST_SSD=owned)
                      subprocess.run(['sh', '-c', wrapper + install], cwd=work, env=env, check=True)
                      if changed:
                          binary.unlink()
                          binary.write_text('not the temporary shim\n')
                      result = subprocess.run(['sh', '-c', wrapper + remove], cwd=work, env=env)
                      if changed:
                          if result.returncode == 0 or binary.read_text() != 'not the temporary shim\n':
                              raise SystemExit('Unsafe cleanup regression')
                          if (root / (owned.lstrip('/') + '.distrib')).read_text() != 'original executable\n':
                              raise SystemExit('Saved executable was modified')
                      elif result.returncode != 0 or binary.read_text() != 'original executable\n':
                          raise SystemExit('Diversion restoration regression')
          script.write_text(patched)
          print('Diversion repair applied; shell syntax and merged-/usr safety tests passed.')
          PY
      - run: lb config --bootstrap-flavour minimal --mode ubuntu --distribution jammy --architectures amd64 --binary-images iso-hybrid --archive-areas "main universe" --linux-flavours generic --linux-packages "linux-image" --initramfs casper --apt-recommends false --memtest false --syslinux-theme live-build && test "$(grep -c 'tar xfz .*gfxboot-theme-ubuntu' /usr/lib/live/build/lb_binary_syslinux)" -eq 2 && sudo sed -i '/tar xfz .*gfxboot-theme-ubuntu/s/.*tar xfz.*/                :/' /usr/lib/live/build/lb_binary_syslinux && grep -q 'mv binary/live/vmlinuz-' /usr/lib/live/build/lb_binary_syslinux && sudo sed -i 's|binary/live/|binary/casper/|g; s|/live/vmlinuz|/casper/vmlinuz|g; s|/live/initrd|/casper/initrd|g' /usr/lib/live/build/lb_binary_syslinux && grep -q 'Chroot chroot "rsvg --format png --height 480 --width 640 splash.svg splash.png"' /usr/lib/live/build/lb_binary_syslinux && sudo sed -i 's|Chroot chroot "rsvg --format png --height 480 --width 640 splash.svg splash.png"|Chroot chroot "rsvg-convert --format png --height 480 --width 640 --output splash.png splash.svg"|' /usr/lib/live/build/lb_binary_syslinux && test "$(grep -Fc 'tmpdir="$(mktemp -d)"' /usr/lib/live/build/lb_binary_syslinux)" -eq 1 && test "$(grep -Fc 'rm -rf "$tmpdir"' /usr/lib/live/build/lb_binary_syslinux)" -eq 1 && sudo sed -i '/tmpdir="$(mktemp -d)"/i\if [ -f "${_TARGET}/bootlogo" ]; then' /usr/lib/live/build/lb_binary_syslinux && sudo sed -i '/rm -rf "$tmpdir"/a\fi' /usr/lib/live/build/lb_binary_syslinux && sh -n /usr/lib/live/build/lb_binary_syslinux && sudo rm -f /usr/share/live/build/bootloaders/isolinux/isolinux.bin /usr/share/live/build/bootloaders/isolinux/vesamenu.c32 && sudo install -m 644 /usr/lib/ISOLINUX/isolinux.bin /usr/share/live/build/bootloaders/isolinux/isolinux.bin && sudo install -m 644 /usr/lib/syslinux/modules/bios/vesamenu.c32 /usr/share/live/build/bootloaders/isolinux/vesamenu.c32
      - run: printf 'LB_BOOTSTRAP_INCLUDE="gnupg ca-certificates"\n' >> config/bootstrap
      - name: Keep signature tooling installed inside the build chroot
        run: printf 'gnupg\n' > config/package-lists/nexium-build-tools.list.chroot && (echo initramfs-tools; echo syslinux-utils) >> config/package-lists/nexium-build-tools.list.chroot
      - name: Resolve and prepare the app set for Ubuntu jammy
        run: docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 bash scripts/prepare-apps.sh && sudo sed -i '/^\(chromium\|librewolf\|brave-browser\|telegram-desktop\)$/d' config/package-lists/nexium-apps.list.chroot && sudo rm -f config/packages.chroot/discord.deb config/packages.chroot/ungoogled-chromium.deb && cat config/package-lists/nexium-apps.list.chroot
      - name: Prepare binary vendor keyrings for the build chroot
        run: |
          sudo bash <<'SH'
          set -euo pipefail
          keydir=config/includes.chroot/etc/apt/keyrings
          sources=reports/vendor-sources
          install -d -m 755 "$keydir" "$sources"
          for name in mozilla librewolf; do
            gpg --batch --yes --dearmor -o "$keydir/nexium-$name.gpg" "config/archives/nexium-$name.key.chroot"
            chmod 644 "$keydir/nexium-$name.gpg"
            gpg --batch --show-keys "$keydir/nexium-$name.gpg"
            for stage in chroot binary; do
              list="config/archives/nexium-$name.list.$stage"
              grep -qF '[arch=amd64]' "$list"
              sed -i "s|\[arch=amd64\]|[arch=amd64 signed-by=/etc/apt/keyrings/nexium-$name.gpg]|" "$list"
              # These keys are scoped by signed-by, not imported as global trust.
              rm "config/archives/nexium-$name.key.$stage"
            done
            install -m 644 "config/archives/nexium-$name.list.chroot" "$sources/nexium-$name.list"
          done
          SH
      - name: Save package resolution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexium-app-resolution
          path: |
            reports/
            config/package-lists/nexium-apps.list.chroot
          if-no-files-found: warn
      - name: Build and validate chroot stages
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          import subprocess
          # Cache restoration precedes archives; seed from config at actual APT time.
          script = Path('/usr/lib/live/build/lb_chroot_archives')
          original = script.read_text()
          needle = 'Apt chroot update'
          if sum(line.strip() == needle for line in original.splitlines()) != 4:
              print('Warning: unrecognized archives update layout; continuing')
          seed = '''install -d -m 755 chroot/etc/apt/keyrings chroot/etc/apt/sources.list.d || exit 1
          for vendor in mozilla librewolf; do
            install -m 644 "config/includes.chroot/etc/apt/keyrings/nexium-$vendor.gpg" "chroot/etc/apt/keyrings/nexium-$vendor.gpg" || exit 1
            install -m 644 "config/archives/nexium-$vendor.list.chroot" "chroot/etc/apt/sources.list.d/nexium-$vendor.list" || exit 1
            gpg --batch --show-keys "chroot/etc/apt/keyrings/nexium-$vendor.gpg" || exit 1
          done
          Chroot chroot "ls -l /etc/apt/keyrings/nexium-mozilla.gpg /etc/apt/keyrings/nexium-librewolf.gpg" || exit 1
          Chroot chroot "od -An -tx1 -N16 /etc/apt/keyrings/nexium-mozilla.gpg" || exit 1
          Chroot chroot "od -An -tx1 -N16 /etc/apt/keyrings/nexium-librewolf.gpg" || exit 1
          Chroot chroot "cat /etc/apt/sources.list.d/nexium-mozilla.list /etc/apt/sources.list.d/nexium-librewolf.list" || exit 1
          Chroot chroot "apt-get -o APT::Update::Error-Mode=any update" || exit 1
          Echo_message "Nexium vendor APT verified inside build chroot"
          '''
          patched = ''
          for line in original.splitlines(keepends=True):
              if line.strip() == needle:
                  indent = line[:len(line) - len(line.lstrip())]
                  patched += ''.join(indent + part + '\n' for part in seed.splitlines())
              else:
                  patched += line
          subprocess.run(['sh', '-n'], input=patched, text=True, check=True)
          script.write_text(patched)
          print('Archives keyring installation guarded at all four in-chroot APT updates.')
          # Host chmod must not follow absolute /boot links outside the chroot.
          hacks = Path('/usr/lib/live/build/lb_chroot_hacks')
          original = hacks.read_text()
          needle = "find chroot/boot -name 'initrd*' -print0 | xargs -r -0 chmod go+r"
          if original.count(needle) != 1:
              print('Warning: unrecognized initramfs permissions layout; continuing')
          patched = original.replace(needle, needle.replace(' -name ', ' -type f -name '))
          subprocess.run(['sh', '-n'], input=patched, text=True, check=True)
          hacks.write_text(patched)
          print('Initramfs permissions apply to regular files, not chroot symlinks.')
          PY
          if [ "${{ inputs.validate_only }}" = "true" ]; then
            sudo lb bootstrap
            sudo lb chroot
            sudo chroot chroot gpg --version
            test ! -e .build/start-stop-daemon.path
            echo 'Nexium chroot validation passed: archives install, hacks, archives remove, dpkg remove.'
          else
            test "$(grep -c 'MKSQUASHFS_OPTIONS=.*-no-progress' /usr/lib/live/build/lb_binary_rootfs)" -eq 1 && sudo sed -i '/MKSQUASHFS_OPTIONS=.*-no-progress/a\MKSQUASHFS_OPTIONS="${MKSQUASHFS_OPTIONS} -comp xz"' /usr/lib/live/build/lb_binary_rootfs && sh -n /usr/lib/live/build/lb_binary_rootfs && sudo lb build && sudo mv binary.hybrid.iso live-image-amd64.hybrid.iso && iso=live-image-amd64.hybrid.iso && test -f "$iso" && size=$(stat -c %s "$iso") && echo "ISO bytes $size" && test "$size" -lt 1000000000 && sha256sum "$iso"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.validate_only }}
        with:
          name: nexium-iso
          path: "*.iso"
          if-no-files-found: error
