name: Ship Nexium browser with measured replacement and full boot proof
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/nexium-browser-full-pass.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: nexium-phase2
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated browser integration without changing Chromium pass
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso librsvg2-bin python3-yaml python3-pil xvfb x11-utils xdotool initramfs-tools-core qemu-system-x86 ffmpeg tesseract-ocr fonts-dejavu-core
          mkdir -p reports/boot/frames reports/browser output work
          test -f browser/nexium_browser.py
          python3 desktop/phase2.py --materialize
          python3 scripts/prepare-ios4.py
          cat > scripts/nexium-phase2.py <<'PY'
          #!/usr/bin/env python3
          """Browser-specific adapter; original queued Chromium scripts remain unchanged."""
          import argparse, importlib.util, json, hashlib, shutil, subprocess, re, os
          from pathlib import Path
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path);mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod);return mod
          phase=load('phase','desktop/phase2.py')
          chrom=load('chrom','scripts/chromium-localhost.py')
          original_run=subprocess.run
          phase.APPS[:]=[(k,'Nexium Browser','/usr/local/bin/nexium-browser','web-browser') if k=='browser' else (k,n,c,i) for k,n,c,i in phase.APPS]
          def browser_config(root,install=False):
              r=Path(root)
              if install:
                  for p in sorted(chrom.enterprise(r),key=lambda p:len(p.parts)):
                      if not p.exists() and not p.is_symlink():continue
                      if p.is_dir() and not p.is_symlink():shutil.rmtree(p)
                      else:p.unlink()
                  for p,kind in chrom.files(r).items():
                      if kind=='policy/preferences' and chrom.BAD.search(p.read_text()):
                          p.write_text(json.dumps(chrom.clean(json.loads(p.read_text())),indent=2)+'\n')
                  # Non-enterprise compatibility preferences keep localhost guards non-vacuous.
                  for base in ['etc/skel','home/nexium']:
                      p=r/base/'.config/chromium/Default/Preferences';p.parent.mkdir(parents=True,exist_ok=True)
                      p.write_text(json.dumps({'homepage':'https://github.com/highitsave/nexium-os-releases','proxy':{'mode':'direct'}},indent=2)+'\n')
                  p=r/'usr/local/bin/nexium-update-check';p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(Path('scripts/nexium-update-check').read_bytes());p.chmod(0o755)
                  (r/'etc/nexium-version').write_text('1.2-golden-gate-nexium-browser\n')
              chrom.guard(r)
          def run_hook(argv,*args,**kw):
              if isinstance(argv,list) and len(argv)>3 and argv[1]=='scripts/chromium-localhost.py':
                  browser_config(argv[3],argv[2]=='fix');return subprocess.CompletedProcess(argv,0)
              return original_run(argv,*args,**kw)
          subprocess.run=run_hook
          def verify_browser(root):
              r=Path(root)
              assert not (r/'opt/ungoogled-chromium/chrome').exists(),'Standalone Chromium was not removed'
              for target in ['/usr/local/bin/nexium-browser','/opt/nexium-browser/venv/bin/python']:
                  phase.output_executable(r,target)
              assert (r/'usr/local/lib/nexium/nexium_browser.py').read_bytes()==Path('browser/nexium_browser.py').read_bytes()
              original_run(['chroot',str(r),'/opt/nexium-browser/venv/bin/python','-c','from PySide6.QtWebEngineWidgets import QWebEngineView; from PySide6.QtWebEngineCore import QWebEngineProfile,QWebEnginePage; print("PASS PYSIDE6 QTWEBENGINE IMPORTS")'],check=True)
              print('PASS NEXIUM browser source, isolated Python, imports, and removal of standalone Chromium')
          phase.verify_ungoogled=verify_browser
          def install(root):
              phase.install(root)
              r=Path(root)
              script=r/'usr/local/lib/nexium/nexium_browser.py';script.write_bytes(Path('browser/nexium_browser.py').read_bytes());script.chmod(0o644)
              launcher=r/'usr/local/bin/nexium-browser'
              launcher.write_text('#!/bin/sh\nunset http_proxy https_proxy all_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY\nexport QT_QPA_PLATFORM=xcb\nexec /opt/nexium-browser/venv/bin/python /usr/local/lib/nexium/nexium_browser.py "$@"\n');launcher.chmod(0o755)
              desktop=r/'usr/share/applications/nexium-browser.desktop'
              desktop.write_text('[Desktop Entry]\nType=Application\nName=Nexium Browser\nExec=/usr/local/bin/nexium-browser\nIcon=nexium-browser\nTerminal=false\nCategories=Network;WebBrowser;\nMimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;\nStartupWMClass=nexium_browser.py\n')
              icon=r/'usr/share/icons/hicolor/scalable/apps/nexium-browser.svg';icon.parent.mkdir(parents=True,exist_ok=True)
              icon.write_bytes(Path('branding/icons/nexium-browser.svg').read_bytes())
              mapping=json.loads(Path('branding/icons/ios4/mapping.json').read_text())
              uid,gid=next((int(x.split(':')[2]),int(x.split(':')[3])) for x in (r/'etc/passwd').read_text().splitlines() if x.startswith('nexium:'))
              paths=[script,launcher,desktop,icon]
              for base in ['etc/skel','home/nexium']:
                  p=r/base/'.config/mimeapps.list';p.parent.mkdir(parents=True,exist_ok=True);p.write_text('[Default Applications]\ntext/html=nexium-browser.desktop\nx-scheme-handler/http=nexium-browser.desktop\nx-scheme-handler/https=nexium-browser.desktop\n');paths.append(p)
                  if base=='home/nexium':os.chown(p,uid,gid)
              manifest=json.loads(Path('reports/phase2-manifest.json').read_text())
              for p in paths:manifest['/'+str(p.relative_to(r))]=hashlib.sha256(p.read_bytes()).hexdigest()
              Path('reports/phase2-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          def verify(root):
              # Original checks still validate all ten iOS4 icons before custom browser icon override.
              r=Path(root);desktop=r/'usr/share/applications/nexium-browser.desktop'
              saved=desktop.read_bytes();mapping=json.loads(Path('branding/icons/ios4/mapping.json').read_text())
              manifest=json.loads(Path('reports/phase2-manifest.json').read_text())
              try:
                  desktop.write_text(saved.decode().replace('Icon=nexium-browser','Icon=ios4-'+mapping['browser']))
                  manifest['/usr/share/applications/nexium-browser.desktop']=hashlib.sha256(desktop.read_bytes()).hexdigest()
                  Path('reports/phase2-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
                  phase.verify(root)
              finally:
                  desktop.write_bytes(saved)
                  manifest['/usr/share/applications/nexium-browser.desktop']=hashlib.sha256(saved).hexdigest()
                  Path('reports/phase2-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
              assert 'Icon=nexium-browser' in desktop.read_text()
              assert (r/'usr/share/icons/hicolor/scalable/apps/nexium-browser.svg').read_bytes()==Path('branding/icons/nexium-browser.svg').read_bytes()
              for name,digest in manifest.items():assert hashlib.sha256((r/name.lstrip('/')).read_bytes()).hexdigest()==digest,name
              print('PASS actual on-disk Nexium browser launcher and custom Nexium icon; full final manifest SHA256 checked')
          if __name__=='__main__':
              a=argparse.ArgumentParser();a.add_argument('--install');a.add_argument('--verify');o=a.parse_args()
              if o.install:install(o.install)
              if o.verify:verify(o.verify)
          PY
          mkdir -p branding/icons
          cat > branding/icons/nexium-browser.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><rect x="4" y="4" width="120" height="120" rx="28" fill="#9c72e9"/><path d="M34 94V34h14l32 38V34h14v60H80L48 56v38z" fill="white"/></svg>
          SVG
          cat > scripts/install-nexium-browser.sh <<'SH'
          #!/bin/bash
          set -euxo pipefail
          root=work/root
          sudo cat "$root/etc/os-release" | tee reports/browser/debian-base.txt
          sudo chroot "$root" dpkg-query -W -f='${Package}\t${Version}\t${Installed-Size}\n' > reports/browser/packages-before.tsv
          sudo chroot "$root" apt-cache policy python3-pyside6 python3-pyside6.qtwebenginewidgets python3-pyside6.qtwebenginecore python3-pyqt6.qtwebengine libqt6webenginecore6 qt6-webengine | tee reports/browser/debian-pyside6-availability.txt
          sudo chroot "$root" apt-cache search pyside6 | tee reports/browser/pyside6-search.txt
          pkgs=$(sudo chroot "$root" dpkg-query -W -f='${Package}\n' | grep -E '^(ungoogled-chromium|chromium)(-|$)' || true)
          sudo du -sb "$root/opt/ungoogled-chromium" | tee reports/browser/standalone-chromium-bytes.txt
          if [ -n "$pkgs" ]; then sudo chroot "$root" env DEBIAN_FRONTEND=noninteractive apt-get purge -y $pkgs; fi
          sudo rm -rf "$root/opt/ungoogled-chromium"
          sudo rm -f "$root/usr/bin/chromium" "$root/usr/bin/ungoogled-chromium"
          native='python3 python3-venv ca-certificates libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 libgl1 libegl1 libopengl0 libnss3 libnspr4 libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxrandr2 libxfixes3 libdrm2 libgbm1 libasound2 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1 libx11-xcb1 libxrender1 libxext6 libx11-6'
          sudo chroot "$root" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $native
          sudo chroot "$root" python3 -m venv /opt/nexium-browser/venv
          sudo chroot "$root" /opt/nexium-browser/venv/bin/pip install --only-binary=:all: --no-cache-dir PySide6
          sudo chroot "$root" /opt/nexium-browser/venv/bin/pip freeze | tee reports/browser/python-lock.txt
          sudo chroot "$root" /opt/nexium-browser/venv/bin/python -c 'import PySide6; from PySide6.QtWebEngineWidgets import QWebEngineView; from PySide6.QtWebEngineCore import QWebEngineProfile,QWebEnginePage; print("PySide6",PySide6.__version__); print("PASS QTWEBENGINE IMPORTS")' | tee reports/browser/imports.txt
          sudo du -sb "$root/opt/nexium-browser/venv" | tee reports/browser/pyside6-footprint.txt
          for bin in $(sudo find "$root/opt/nexium-browser" -name QtWebEngineProcess -o -name libQt6WebEngineCore.so.6 -o -name libqxcb.so); do
            target=${bin#work/root}
            sudo chroot "$root" ldd "$target" | tee -a reports/browser/loader.txt
          done
          ! grep -q 'not found' reports/browser/loader.txt
          sudo chroot "$root" dpkg-query -W -f='${Package}\t${Version}\t${Installed-Size}\n' > reports/browser/packages-after.tsv
          python3 - <<'PY'
          from pathlib import Path
          import json
          def read(name):
              return {p:(v,int(k)*1024) for p,v,k in (l.split('\t') for l in Path(name).read_text().splitlines())}
          before=read('reports/browser/packages-before.tsv');after=read('reports/browser/packages-after.tsv')
          added={p:{'version':v,'installed_bytes':n,'before_bytes':before.get(p,('',0))[1]} for p,(v,n) in after.items() if before.get(p)!=(v,n)}
          removed={p:{'version':v,'installed_bytes':n} for p,(v,n) in before.items() if p not in after}
          venv=int(Path('reports/browser/pyside6-footprint.txt').read_text().split()[0])
          delta=sum(v['installed_bytes']-v['before_bytes'] for v in added.values())
          savings=sum(v['installed_bytes'] for v in removed.values())
          report={'baseline_iso_user_reported_bytes':764084224,'ceiling_bytes':1000000000,'headroom_bytes':235915776,'pyside6_venv_apparent_bytes':venv,'native_package_delta_installed_bytes':delta,'removed_packages_installed_bytes':savings,'uncompressed_conservative_addition_without_removal':764084224+venv+delta,'uncompressed_budget_with_package_removal':764084224+venv+delta-savings,'important':'Installed footprint is NOT compressed ISO size. Only rebuilt ISO stat determines fit. Debian PyQt6 does not provide PySide6 modules; compatible pinned wheel lock is used.','added_or_changed':added,'removed':removed,'largest_remaining_packages':sorted([{'name':p,'bytes':n} for p,(v,n) in after.items()],key=lambda x:x['bytes'],reverse=True)[:15]}
          Path('reports/browser/size-math.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
          PY
          SH
          python3 - <<'PY'
          from pathlib import Path
          import ast, re
          shell=Path('scripts/build-phase2.sh').read_text().replace('python3 desktop/phase2.py','python3 scripts/nexium-phase2.py')
          needle='sudo chroot work/root apt-get update\n'
          assert shell.count(needle)==1
          shell=shell.replace(needle,needle+'bash scripts/install-nexium-browser.sh\n')
          # Duplicate isolated build, never alter queued Chromium pass.
          Path('scripts/build-nexium-browser.sh').write_text(shell)
          capture=Path('scripts/capture-dock-cream.py').read_text()
          capture=capture.replace("command('ldd /opt/ungoogled-chromium/chrome')","command('find /opt/nexium-browser/venv -name QtWebEngineProcess -exec ldd {} \\;')")
          capture=capture.replace("os.path.realpath('/opt/ungoogled-chromium/chrome')","os.path.realpath('/opt/nexium-browser/venv/bin/python')")
          capture=capture.replace("'Chromium' not in m[2]","m[2] != 'Nexium Browser'")
          needle="browser = subprocess.Popen(argv, stdout=browser_log, stderr=subprocess.STDOUT)"
          automation='''
          # Accept the actual Terms widget through X11 input; no shipped bypass.
          time.sleep(5)
          terms = command("xdotool search --name 'Nexium Browser.*Terms of Service'")
          data['terms_window'] = terms
          if terms['exit'] == 0 and terms['output'].strip():
              wid = terms['output'].splitlines()[0]
              command('xdotool windowactivate --sync ' + wid)
              command('xdotool key --window ' + wid + ' Tab Tab Return')
              time.sleep(8)
          '''
          automation='\n'.join(line[10:] if line.startswith('          ') else line for line in automation.splitlines())
          assert capture.count(needle)==1
          capture=capture.replace(needle,needle+'\n'+automation)
          capture=capture.replace('REAL CHROMIUM GUI','REAL NEXIUM GUI').replace('CHROMIUM STDOUT','NEXIUM STDOUT').replace('dock Chromium GUI','dock Nexium GUI')
          tree=ast.parse(capture)
          for node in tree.body:
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='probe' for t in node.targets):compile(ast.literal_eval(node.value),'guest-probe','exec')
          Path('scripts/capture-nexium-browser.py').write_text(capture)
          PY
          python3 -m py_compile scripts/nexium-phase2.py scripts/capture-nexium-browser.py browser/nexium_browser.py
          bash -n scripts/build-nexium-browser.sh scripts/install-nexium-browser.sh
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          for p in Path('.github/workflows').glob('*.yml'):assert isinstance(yaml.safe_load(p.read_text()),dict);print('PASS YAML',p)
          PY
          git config user.name Onx
          git config user.email assistant@email.tomo.ai
          rm -rf scripts/__pycache__ browser/__pycache__ desktop/__pycache__
          git add scripts/nexium-phase2.py scripts/install-nexium-browser.sh scripts/build-nexium-browser.sh scripts/capture-nexium-browser.py branding/icons/nexium-browser.svg
          git commit -m 'Add isolated Nexium browser replacement, measured dependencies and full boot proof'
          git restore -- .github/workflows/phase2-build.yml
          git pull --rebase origin main
          git push origin HEAD:main
          git rev-parse HEAD | tee reports/source-commit.txt
      - uses: actions/download-artifact@v4
        with:
          name: nexium-tab-1.2-ungoogled-iso
          run-id: 38179706990
          github-token: ${{ github.token }}
          path: source
      - name: Replace standalone Chromium, build and keep all boot preservation assertions
        run: bash scripts/build-nexium-browser.sh
      - name: Capture actual dock launched Nexium browser, cream, sudo and network
        run: python3 scripts/capture-nexium-browser.py | tee reports/boot-capture.txt
      - name: Publish exact measured evidence, including failure diagnostics
        if: always()
        run: |
          set -euxo pipefail
          dest=tests/nexium-browser-evidence/${GITHUB_RUN_ID}
          mkdir -p "$dest"
          cp reports/browser/* "$dest/" 2>/dev/null || true
          cp reports/boot/*.png reports/boot/*.json reports/*.txt reports/admin-network-manifest.json "$dest/" 2>/dev/null || true
          git config user.name Onx
          git config user.email assistant@email.tomo.ai
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record Nexium browser measured dependency and live proof ${GITHUB_RUN_ID}"
            git restore -- .github/workflows/phase2-build.yml
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          { echo '## Nexium browser measured full pass'; cat reports/browser/size-math.json reports/size.txt reports/iso-sha256.txt reports/boot/receipt.json reports/boot/live-session.json 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexium-browser-iso
          path: output/
          compression-level: 0
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexium-browser-full-verification
          path: reports/
          if-no-files-found: error
