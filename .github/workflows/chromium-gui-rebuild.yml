{"name":"Rebuild Chromium GUI and public GitHub updater","on":{"workflow_dispatch":{},"push":{"branches":["main"],"paths":[".github/workflows/chromium-gui-rebuild.yml"]}},"permissions":{"contents":"write","actions":"read"},"concurrency":{"group":"nexium-phase2","cancel-in-progress":false},"jobs":{"build":{"runs-on":"ubuntu-24.04","timeout-minutes":45,"steps":[{"uses":"actions/checkout@v4"},{"name":"Commit diagnosed browser GUI and token-free update source","shell":"bash","run":"set -euxo pipefail\nsudo apt-get update\nsudo apt-get install -y squashfs-tools xorriso librsvg2-bin python3-yaml python3-pil xvfb x11-utils xdotool initramfs-tools-core qemu-system-x86 ffmpeg tesseract-ocr fonts-dejavu-core\nmkdir -p reports output work\npython3 - <<'PY'\nfrom pathlib import Path as P\nimport json,hashlib\nd=json.loads(P('tests/chromium-diagnosis/38321280499/live-session.json').read_text())\nassert 'not found' not in d['loader']['output']\nfor t in d['browser_trials']:\n assert t['state']=='running' and t['exit_code'] is None and 'about:blank - Chromium' in t['windows']['output'];print('EXACT ISO DIAGNOSIS',t['label'],t['elapsed_seconds'],t['exit_code'],repr(t['stdout_stderr']))\npreserved=[p for base in ['desktop','branding'] for p in P(base).rglob('*') if p.is_file()]+[P('scripts/build-phase2.sh'),P('scripts/live-admin-network.py'),P('scripts/verify-phase2-boot.py')]\nhashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in preserved}\npage='https://github.com/highitsave/nexium-os-releases'\nupdater='''#!/usr/bin/env python3\nimport json,os,subprocess,urllib.request,urllib.error\nfrom pathlib import Path\nPAGE='https://github.com/highitsave/nexium-os-releases'\nAPI='https://api.github.com/repos/highitsave/nexium-os-releases/releases/latest'\ndef compare(local,release):\n tag=(release.get('tag_name') or release.get('name')) if release else None\n return {'status':'no_releases' if not tag else 'current' if tag==local else 'update_available','current_version':local,'latest_tag':tag,'page':PAGE}\ndef main():\n try:\n  local=Path('/etc/nexium-version').read_text().strip()\n  request=urllib.request.Request(API,headers={'Accept':'application/vnd.github+json','User-Agent':'Nexium-public-update-check'})\n  try:\n   with urllib.request.urlopen(request,timeout=12) as r:release=json.load(r)\n  except urllib.error.HTTPError as e:\n   if e.code!=404:raise\n   release=None\n  result=compare(local,release)\n except (OSError,ValueError,urllib.error.URLError) as e:result={'status':'unavailable','error':str(e),'page':PAGE}\n print(json.dumps(result,indent=2),flush=True)\n if result['status']=='update_available' and '--notify' in __import__('sys').argv and os.environ.get('DISPLAY'):\n  text='Nexium update available: '+result['latest_tag']+'\\n'+PAGE\n  try:subprocess.run(['/usr/bin/zenity','--info','--title=Nexium update available','--text='+text,'--timeout=30'],timeout=35)\n  except (OSError,subprocess.TimeoutExpired):pass\nif __name__=='__main__':main()\n'''\ncompile(updater,'update-check','exec');ns={};exec(compile(updater,'update-check','exec'),ns);assert ns['compare']('x',None)['status']=='no_releases';assert ns['compare']('x',{'tag_name':'x'})['status']=='current';assert ns['compare']('x',{'tag_name':'y'})['status']=='update_available'\nP('scripts/nexium-update-check').write_text(updater)\np=P('scripts/chromium-localhost.py');s=p.read_text();s=s.replace('about:blank',page)\nold='exec /opt/ungoogled-chromium/chrome --no-proxy-server';assert s.count(old)==1;s=s.replace(old,'exec /opt/ungoogled-chromium/chrome',1)\nold=\"assert '--no-proxy-server' in text and 'set -- \"+page+\"' in text\";assert old in s;s=s.replace(old,\"assert 'set -- \"+page+\"' in text and '--no-sandbox' not in text and '--no-proxy-server' not in text\",1)\ninstall=\"\n    # Public-only updater; no credential or enterprise policy.\n    update=root/'usr/local/bin/nexium-update-check';update.parent.mkdir(parents=True,exist_ok=True)\n    update.write_bytes(type(root)('scripts/nexium-update-check').read_bytes());update.chmod(0o755)\n    (root/'etc/nexium-version').write_text('1.2-golden-gate-phase2\\n')\n    for name in ['etc/xdg/autostart/nexium-update-check.desktop','usr/share/applications/nexium-update-check.desktop']:\n        entry=root/name;entry.parent.mkdir(parents=True,exist_ok=True)\n        entry.write_text('[Desktop Entry]\\nType=Application\\nName=Check Nexium Updates\\nExec=/usr/local/bin/nexium-update-check --notify\\nIcon=system-software-update\\nTerminal=false\\nCategories=System;\\n')\n\"\nneedle='    guard(root)\n    tracked=';assert needle in s;s=s.replace(needle,install+needle,1)\nneedle='def verify(root):\n';assert needle in s;s=s.replace(needle,needle+\"    assert (root/'usr/local/bin/nexium-update-check').read_bytes()==type(root)('scripts/nexium-update-check').read_bytes()\n    assert (root/'etc/nexium-version').read_text().strip()=='1.2-golden-gate-phase2'\n    for name in ['etc/xdg/autostart/nexium-update-check.desktop','usr/share/applications/nexium-update-check.desktop']:assert 'Exec=/usr/local/bin/nexium-update-check --notify' in (root/name).read_text()\n    print('PASS public update checker/version/autostart; no credentials',flush=True)\n\",1)\ncompile(s,str(p),'exec');p.write_text(s)\np=P('scripts/capture-dock-cream.py');s=p.read_text();start=s.index(\"browser_log=open('/tmp/nexium-browser.log','w')\");end=s.index(\"data['commands']=[command(c) for c in commands]\",start)\nprobe=r'''import time,re,shlex\ndata['browser_runtime']={k:os.environ.get(k) for k in ['HOME','DISPLAY','XDG_RUNTIME_DIR']}\ndata['browser_ldd']=command('ldd /opt/ungoogled-chromium/chrome')\ndata['browser_paths']=command('ls -ld "$HOME" "$XDG_RUNTIME_DIR" /dev/shm; df -h /dev/shm')\ntext=open('/usr/share/applications/nexium-browser.desktop').read()\nargv=shlex.split(next(line[5:] for line in text.splitlines() if line.startswith('Exec=')))\nlog_path='/tmp/nexium-browser.log';browser_log=open(log_path,'w')\nbrowser=subprocess.Popen(argv,stdout=browser_log,stderr=subprocess.STDOUT)\nbegan=time.monotonic();data['browser_timeline']=[];data['browser_processes']=[];data['browser_windows']=[]\nwhile time.monotonic()-began<150:\n processes=[]\n for pid in os.listdir('/proc'):\n  if not pid.isdigit():continue\n  try:cmd=[part.decode() for part in open('/proc/'+pid+'/cmdline','rb').read().split(bytes([0])) if part]\n  except (OSError,UnicodeError):continue\n  if cmd and cmd[0]=='/opt/ungoogled-chromium/chrome' and not any(c.startswith('--type=') for c in cmd):processes.append({'pid':pid,'argv':cmd})\n tree=command('xwininfo -root -tree');windows=[]\n for line in tree['output'].splitlines():\n  m=re.search(r'(0x[0-9a-f]+) "([^"]*)": .*?(\d+)x(\d+)',line)\n  if not m or 'Chromium' not in m[2] or int(m[3])<100 or int(m[4])<100:continue\n  view=command('xwininfo -id '+m[1])\n  if view['exit']==0 and 'Map State: IsViewable' in view['output']:windows.append({'id':m[1],'title':m[2],'view':view})\n rc=browser.poll();data['browser_timeline'].append({'seconds':round(time.monotonic()-began,3),'exit':rc,'processes':processes,'windows':len(windows)})\n data['browser_processes']=processes;data['browser_windows']=windows;data['browser_window_tree']=tree\n if processes and windows or rc is not None:break\n time.sleep(2)\nbrowser_log.flush();data['browser_launch']={'dock_exec':argv,'pid':browser.pid,'exit_code':browser.poll(),'seconds':round(time.monotonic()-began,3),'stdout_stderr':open(log_path).read()}\ndata['browser_gui_pass']=bool(data['browser_processes'] and data['browser_windows']) and browser.poll() is None and 'not found' not in data['browser_ldd']['output']\ndata['browser_log']=command('cat '+log_path)\ndata['update_check']=command('/usr/local/bin/nexium-update-check')\ndata['image_version']=command('cat /etc/nexium-version')\nprint('REAL CHROMIUM GUI',json.dumps({k:v for k,v in data.items() if k.startswith('browser_')},indent=2),flush=True)\n'''\ns=s[:start]+probe+s[end:];s=s.replace('for _ in range(60):\n        if (O/','for _ in range(180):\n        if (O/',1)\nold=\"assert live.get('browser_processes'),'FAIL: normal-user direct about:blank Chromium process not observed'\";assert old in s;s=s.replace(old,\"assert live.get('browser_gui_pass'),'FAIL: dock Chromium GUI; exit/stdout/stderr/loader/window timeline printed above'\",1);compile(s,str(p),'exec');p.write_text(s)\nfor path,digest in hashes.items():assert hashlib.sha256(P(path).read_bytes()).hexdigest()==digest,path\nP('tests/chromium-gui-repair.md').write_text('Exact failed ISO diagnosis 38321280499: direct/dock/safe all rendered windows and ran after 60 seconds. No missing libraries or sandbox failure; no speculative deps or no-sandbox. Prior 12s snapshot insufficient; timing/filter cause not proven. Actual dock Exec now must produce both live main process and mapped Chromium window within 150s, with real exit/stdout/stderr and timeline. Public GitHub startup in user preferences, original ungoogled ELF/sandbox preserved. Token-free public releases API updater compares /etc/nexium-version=1.2-golden-gate-phase2, handles 404 and offline gracefully, shows notice only when tag differs. Existing policy removal/no-localhost and dock/cream/sudo/network/preservation source retained. No release/email.\n')\nPY\npython3 -m py_compile scripts/chromium-localhost.py scripts/capture-dock-cream.py scripts/nexium-update-check\nrm -rf scripts/__pycache__\ngit config user.name Onx\ngit config user.email assistant@email.tomo.ai\ngit add scripts/chromium-localhost.py scripts/capture-dock-cream.py scripts/nexium-update-check tests/chromium-gui-repair.md\ngit commit -m 'Public release startup and updater; require actual dock Chromium GUI with exit logs'\ngit push origin HEAD:main\ngit rev-parse HEAD | tee reports/source-commit.txt\ncp tests/chromium-diagnosis/38321280499/live-session.json reports/chromium-original-iso-diagnosis.json\npython3 desktop/phase2.py --materialize | tee reports/source.txt\npython3 scripts/prepare-ios4.py | tee 