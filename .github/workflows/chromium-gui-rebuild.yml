name: Rebuild Chromium GUI and public GitHub updater
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/chromium-gui-rebuild.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: nexium-phase2
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate every workflow and repair source before building
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso librsvg2-bin python3-yaml python3-pil xvfb x11-utils xdotool initramfs-tools-core qemu-system-x86 ffmpeg tesseract-ocr fonts-dejavu-core
          mkdir -p reports output work
          python3 - <<'PY' | tee reports/workflow-validation.txt
          from pathlib import Path
          import yaml
          files = sorted(Path('.github/workflows').glob('*.yml')) + sorted(Path('.github/workflows').glob('*.yaml'))
          assert files
          for f in files:
              data = yaml.safe_load(f.read_text())
              assert isinstance(data, dict) and 'jobs' in data, str(f)
              print('PASS YAML', f)
          PY
          if command -v actionlint; then actionlint -color 2>&1 | tee reports/actionlint.txt; else echo 'actionlint not installed on runner' | tee reports/actionlint.txt; fi
          python3 -m py_compile scripts/prepare-chromium-gui.py
          python3 scripts/prepare-chromium-gui.py | tee reports/repair.txt
          python3 -m py_compile scripts/chromium-localhost.py scripts/capture-dock-cream.py scripts/nexium-update-check
          python3 - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('scripts/capture-dock-cream.py').read_text())
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'probe' for t in node.targets):
                  compile(ast.literal_eval(node.value), 'guest-probe', 'exec')
                  print('PASS embedded normal-user GUI probe compile')
          PY
          rm -rf scripts/__pycache__
          git config user.name Onx
          git config user.email assistant@email.tomo.ai
          git add scripts/chromium-localhost.py scripts/capture-dock-cream.py scripts/nexium-update-check tests/chromium-gui-repair.md
          git commit -m 'Public release startup and updater; actual dock Chromium GUI and failure logs'
          git push origin HEAD:main
          git rev-parse HEAD | tee reports/source-commit.txt
          cp tests/chromium-diagnosis/38321280499/live-session.json reports/chromium-original-iso-diagnosis.json
          python3 desktop/phase2.py --materialize | tee reports/source.txt
          python3 scripts/prepare-ios4.py | tee reports/ios4-extraction.txt
      - uses: actions/download-artifact@v4
        with:
          name: nexium-tab-1.2-ungoogled-iso
          run-id: 38179706990
          github-token: ${{ github.token }}
          path: source
      - name: Rebuild full preserved pass and verify Chromium updater
        run: bash scripts/build-phase2.sh
      - name: Capture BIOS cream dock sudo network and actual Chromium GUI
        run: |
          set -euxo pipefail
          mkdir -p reports/boot/frames
          python3 scripts/capture-dock-cream.py | tee reports/boot-capture.txt
      - name: Publish exact boot and GUI evidence
        if: always()
        run: |
          set -euxo pipefail
          git config user.name Onx
          git config user.email assistant@email.tomo.ai
          dest=tests/dock-cream-evidence/${GITHUB_RUN_ID}
          mkdir -p "$dest"
          cp reports/boot/*.png reports/boot/*.jpg reports/boot/*.json "$dest/" 2>/dev/null || true
          cp reports/*.txt reports/chromium-*.json reports/admin-network-manifest.json "$dest/" 2>/dev/null || true
          rm -rf scripts/__pycache__ desktop/__pycache__
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record Chromium GUI and full live boot evidence ${GITHUB_RUN_ID}"
            git restore -- .github/workflows/phase2-build.yml
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexium-phase2-golden-gate-iso
          path: output/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexium-phase2-chromium-gui-verification
          path: reports/
          if-no-files-found: error
